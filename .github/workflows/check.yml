# Her push ve pull request'te: lint, tip kontrolü, metin testleri, statik derleme ve
# Worker paketinin kuruluşu. Yayını Cloudflare Workers Builds yapar; bu iş yalnız uyarır.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir .wrangler/check
